<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBER CHAT</title>
    <style>
        :root {
            --bg-color: #0d0f12;
            --panel-bg: #161b22;
            --accent-color: #00ffcc;
            --accent-glow: rgba(0, 255, 204, 0.4);
            --text-main: #f0f6fc;
            --text-muted: #8b949e;
            --border-color: #30363d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* 共通カードスタイル */
        .card {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            padding: 30px;
            width: 100%;
            max-width: 450px;
            text-align: center;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 24px;
            letter-spacing: 2px;
            color: var(--accent-color);
            text-shadow: 0 0 10px var(--accent-glow);
        }

        button {
            background: transparent;
            color: var(--accent-color);
            border: 2px solid var(--accent-color);
            border-radius: 8px;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            margin-bottom: 15px;
            box-shadow: 0 0 5px var(--accent-glow);
        }

        button:hover {
            background: var(--accent-color);
            color: var(--bg-color);
            box-shadow: 0 0 15px var(--accent-color);
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            background: #21262d;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 16px;
            margin-bottom: 15px;
            outline: none;
            text-align: center;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 10px var(--accent-glow);
        }

        /* 画面切り替えの制御 */
        .screen {
            display: none;
        }

        .screen.active {
            display: block;
        }

        /* 参加入力画面 */
        .back-btn {
            border-color: var(--text-muted);
            color: var(--text-muted);
            box-shadow: none;
            margin-top: 10px;
        }
        .back-btn:hover {
            background: var(--text-muted);
            color: var(--bg-color);
            box-shadow: none;
        }

        /* チャット画面 (UI大改造) */
        #chat-screen {
            width: 100vw;
            height: 100vh;
            max-width: 100%;
            padding: 0;
            border-radius: 0;
            display: none;
            flex-direction: column;
            background: var(--bg-color);
        }

        #chat-screen.active {
            display: flex;
        }

        .chat-header {
            background: var(--panel-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-title {
            font-size: 18px;
            color: var(--accent-color);
            font-weight: bold;
            text-shadow: 0 0 8px var(--accent-glow);
        }

        .room-display {
            font-size: 14px;
            color: var(--text-muted);
            background: #21262d;
            padding: 6px 12px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }

        .leave-btn {
            background: transparent;
            border: 1px solid #ff4f4f;
            color: #ff4f4f;
            padding: 6px 14px;
            font-size: 14px;
            border-radius: 6px;
            width: auto;
            margin: 0;
            box-shadow: none;
        }
        .leave-btn:hover {
            background: #ff4f4f;
            color: #fff;
            box-shadow: 0 0 10px rgba(255, 79, 79, 0.4);
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.5;
            font-size: 15px;
            word-break: break-all;
            position: relative;
        }

        .message.incoming {
            background: var(--panel-bg);
            color: var(--text-main);
            align-self: flex-start;
            border: 1px solid var(--border-color);
            border-top-left-radius: 2px;
        }

        .message.outgoing {
            background: rgba(0, 255, 204, 0.1);
            color: var(--text-main);
            align-self: flex-end;
            border: 1px solid var(--accent-color);
            border-top-right-radius: 2px;
            box-shadow: 0 0 8px rgba(0, 255, 204, 0.05);
        }

        .message-time {
            font-size: 10px;
            color: var(--text-muted);
            margin-top: 5px;
            text-align: right;
        }

        .chat-input-area {
            background: var(--panel-bg);
            border-top: 1px solid var(--border-color);
            padding: 15px 20px;
            display: flex;
            gap: 12px;
        }

        .chat-input-area input {
            flex: 1;
            margin: 0;
            text-align: left;
        }

        .send-btn {
            width: auto;
            margin: 0;
            padding: 0 24px;
        }
    </style>
</head>
<body>

    <!-- 1. 初期選択画面 -->
    <div id="welcome-screen" class="card screen active">
        <h1>CYBER CHAT</h1>
        <button onclick="createRoom()">グループを作成する</button>
        <button onclick="showJoinScreen()">グループに参加する</button>
    </div>

    <!-- 2. グループ参加コード入力画面 -->
    <div id="join-screen" class="card screen">
        <h1>JOIN GROUP</h1>
        <input type="text" id="join-code-input" placeholder="コードを入力してください" autocomplete="off">
        <button onclick="joinRoom()">参加する</button>
        <button onclick="showWelcomeScreen()" class="back-btn">戻る</button>
    </div>

    <!-- 3. 本体のチャット画面（初期状態では非表示） -->
    <div id="chat-screen">
        <div class="chat-header">
            <div class="chat-title">// CHAT_ROOM</div>
            <div class="room-display" id="room-id-tag">CODE: ----</div>
            <button onclick="leaveRoom()" class="leave-btn">退出</button>
        </div>
        
        <div class="messages-container" id="messages-box">
            <!-- メッセージがここに動的に追加されます -->
        </div>

        <div class="chat-input-area">
            <input type="text" id="message-input" placeholder="メッセージを入力..." onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()" class="send-btn">送信</button>
        </div>
    </div>

    <script>
        let currentRoomCode = "";
        let myClientId = Math.random().toString(36).substring(2, 11); // 簡易的な自分識別ID

        // 画面切り替え用関数
        function hideAllScreens() {
            document.getElementById('welcome-screen').classList.remove('active');
            document.getElementById('join-screen').classList.remove('active');
            document.getElementById('chat-screen').classList.remove('active');
        }

        function showWelcomeScreen() {
            hideAllScreens();
            document.getElementById('welcome-screen').classList.add('active');
        }

        function showJoinScreen() {
            hideAllScreens();
            document.getElementById('join-screen').classList.add('active');
            document.getElementById('join-code-input').focus();
        }

        // グループ作成
        function createRoom() {
            const randomCode = "ROOM-" + Math.random().toString(36).substring(2, 6).toUpperCase();
            enterChatRoom(randomCode);
        }

        // グループ参加
        function joinRoom() {
            const codeInput = document.getElementById('join-code-input').value.trim().toUpperCase();
            if (!codeInput) {
                alert("コードを入力してください。");
                return;
            }
            enterChatRoom(codeInput);
        }

        // チャット画面への入場処理
        function enterChatRoom(roomCode) {
            currentRoomCode = roomCode;
            document.getElementById('room-id-tag').textContent = `CODE: ${roomCode}`;
            
            hideAllScreens();
            document.getElementById('chat-screen').classList.add('active');
            
            // チャット履歴の初期読み込み
            loadMessages();
            document.getElementById('message-input').focus();

            // 擬似オンライン同期（LocalStorageの変更を監視）
            window.addEventListener('storage', handleStorageChange);
        }

        // 退出処理
        function leaveRoom() {
            window.removeEventListener('storage', handleStorageChange);
            currentRoomCode = "";
            document.getElementById('messages-box').innerHTML = "";
            document.getElementById('join-code-input').value = "";
            showWelcomeScreen();
        }

        // メッセージ送信
        function sendMessage() {
            const input = document.getElementById('message-input');
            const text = input.value.trim();
            if (!text) return;

            const messageData = {
                id: Math.random().toString(36).substring(2, 11),
                sender: myClientId,
                text: text,
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            };

            // LocalStorageから既存メッセージを取得して追加
            const storageKey = `chat_room_${currentRoomCode}`;
            const messages = JSON.parse(localStorage.getItem(storageKey) || "[]");
            messages.push(messageData);
            localStorage.setItem(storageKey, JSON.stringify(messages));

            // 自分の画面に描画
            appendMessage(messageData);
            input.value = "";
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        }

        // メッセージを表示
        function appendMessage(msg) {
            const box = document.getElementById('messages-box');
            const msgEl = document.createElement('div');
            
            msgEl.classList.add('message');
            if (msg.sender === myClientId) {
                msgEl.classList.add('outgoing');
            } else {
                msgEl.classList.add('incoming');
            }

            msgEl.innerHTML = `
                <div>${escapeHTML(msg.text)}</div>
                <div class="message-time">${msg.time}</div>
            `;
            
            box.appendChild(msgEl);
            box.scrollTop = box.scrollHeight; // 最下部へスクロール
        }

        // メッセージ履歴の読み込み
        function loadMessages() {
            const box = document.getElementById('messages-box');
            box.innerHTML = "";
            const storageKey = `chat_room_${currentRoomCode}`;
            const messages = JSON.parse(localStorage.getItem(storageKey) || "[]");
            messages.forEach(msg => appendMessage(msg));
        }

        // 別のタブでデータが更新されたらリアルタイムに反映
        function handleStorageChange(e) {
            if (e.key === `chat_room_${currentRoomCode}`) {
                const messages = JSON.parse(e.newValue || "[]");
                if (messages.length > 0) {
                    const lastMsg = messages[messages.length - 1];
                    // 最後に送信されたメッセージが自分以外のものであれば追加表示
                    if (lastMsg.sender !== myClientId) {
                        appendMessage(lastMsg);
                    }
                }
            }
        }

        // XSS対策のサニタイズ
        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }
    </script>
</body>
</html>
