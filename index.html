<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark Pulse Chat</title>
    <style>
        :root {
            --bg-color: #0f111a;
            --panel-bg: #151824;
            --border-color: #23273a;
            --accent-color: #00ffcc;
            --accent-hover: #00ccb0;
            --text-main: #f0f3f8;
            --text-muted: #747d95;
            --msg-self: #1e293b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Helvetica Neue', Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* 認証・グループ選択画面 */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        .auth-card {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            padding: 2.5rem;
            border-radius: 16px;
            width: 90%;
            max-width: 420px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
        }

        .auth-card h1 {
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
            color: var(--accent-color);
            letter-spacing: 1px;
        }

        .auth-card p {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 2rem;
        }

        .btn-group {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        button {
            flex: 1;
            padding: 0.8rem;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.95rem;
        }

        .btn-primary {
            background-color: var(--accent-color);
            color: #000;
        }

        .btn-primary:hover {
            background-color: var(--accent-hover);
            box-shadow: 0 0 12px rgba(0,255,204,0.4);
        }

        .btn-secondary {
            background-color: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-main);
        }

        .btn-secondary:hover {
            background-color: rgba(255,255,255,0.05);
            border-color: var(--text-muted);
        }

        .form-section {
            display: none;
            text-align: left;
            margin-top: 1rem;
            border-top: 1px solid var(--border-color);
            padding-top: 1.5rem;
        }

        .form-section.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
        }

        input {
            width: 100%;
            padding: 0.8rem;
            background-color: rgba(0,0,0,0.2);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 1rem;
            margin-bottom: 1rem;
            outline: none;
        }

        input:focus {
            border-color: var(--accent-color);
        }

        /* チャット画面 UI */
        .chat-container {
            width: 100%;
            max-width: 1000px;
            height: 90vh;
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            opacity: 0;
            transform: scale(0.98);
            transition: all 0.4s ease;
            visibility: hidden;
        }

        .chat-container.visible {
            opacity: 1;
            transform: scale(1);
            visibility: visible;
        }

        .chat-header {
            padding: 1rem 1.5rem;
            background-color: rgba(0,0,0,0.15);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .group-info h2 {
            font-size: 1.2rem;
            color: var(--text-main);
        }

        .group-info span {
            font-size: 0.8rem;
            color: var(--accent-color);
            font-family: monospace;
        }

        .leave-btn {
            background-color: transparent;
            border: 1px solid rgba(255,0,0,0.3);
            color: #ff5555;
            padding: 0.5rem 1rem;
            font-size: 0.85rem;
            border-radius: 6px;
        }

        .leave-btn:hover {
            background-color: rgba(255,0,0,0.1);
        }

        .chat-messages {
            flex: 1;
            padding: 1.5rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .message {
            max-width: 70%;
            padding: 0.8rem 1rem;
            border-radius: 12px;
            font-size: 0.95rem;
            line-height: 1.4;
            position: relative;
            animation: messageIn 0.2s ease;
        }

        .message.received {
            background-color: rgba(255,255,255,0.03);
            border: 1px solid var(--border-color);
            align-self: flex-start;
            border-top-left-radius: 4px;
        }

        .message.sent {
            background-color: var(--msg-self);
            align-self: flex-end;
            border-top-right-radius: 4px;
        }

        .meta {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 0.2rem;
            display: block;
        }

        .chat-input-area {
            padding: 1rem 1.5rem;
            background-color: rgba(0,0,0,0.15);
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 1rem;
        }

        .chat-input-area input {
            margin-bottom: 0;
            flex: 1;
        }

        .send-btn {
            background-color: var(--accent-color);
            color: #000;
            width: auto;
            padding: 0 1.5rem;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes messageIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- 1. 初期選択・認証オーバーレイ（これが解除されるまでチャットは見えない） -->
    <div class="overlay" id="authOverlay">
        <div class="auth-card">
            <h1>DARK PULSE</h1>
            <p>グループを作成するか、既存のコードで参加してください</p>
            
            <div class="btn-group">
                <button class="btn-secondary" onclick="showForm('create')">グループ作成</button>
                <button class="btn-primary" onclick="showForm('join')">参加する</button>
            </div>

            <!-- グループ作成フォーム -->
            <div id="createForm" class="form-section">
                <label for="createName">ユーザー名</label>
                <input type="text" id="createName" placeholder="Name">
                <button class="btn-primary" style="width:100%" onclick="processAuth('create')">新しいグループを生成</button>
            </div>

            <!-- グループ参加フォーム -->
            <div id="joinForm" class="form-section">
                <label for="joinName">ユーザー名</label>
                <input type="text" id="joinName" placeholder="Name">
                <label for="joinCode">グループコード</label>
                <input type="text" id="joinCode" placeholder="例: DP-8392">
                <button class="btn-primary" style="width:100%" onclick="processAuth('join')">グループに入る</button>
            </div>
        </div>
    </div>

    <!-- 2. チャットUI本体 -->
    <div class="chat-container" id="chatContainer">
        <div class="chat-header">
            <div class="group-info">
                <h2 id="displayGroupName">チャットルーム</h2>
                <span id="displayGroupCode">CODE: ----</span>
            </div>
            <button class="leave-btn" onclick="leaveGroup()">退出する</button>
        </div>
        
        <div class="chat-messages" id="chatMessages">
            <!-- メッセージ履歴がここに挿入されます -->
        </div>

        <div class="chat-input-area">
            <input type="text" id="messageInput" placeholder="メッセージを入力..." onkeypress="handleKeyPress(event)">
            <button class="send-btn" onclick="sendMessage()">送信</button>
        </div>
    </div>

    <script>
        // 擬似的なリアルタイムオンライン通信のための localStorage 同期システム
        let currentGroup = "";
        let currentUser = "";

        function showForm(type) {
            document.querySelectorAll('.form-section').forEach(el => el.classList.remove('active'));
            if(type === 'create') {
                document.getElementById('createForm').classList.add('active');
            } else if(type === 'join') {
                document.getElementById('joinForm').classList.add('active');
            }
        }

        function processAuth(action) {
            if(action === 'create') {
                const name = document.getElementById('createName').value.trim();
                if(!name) return alert('ユーザー名を入力してください');
                
                // ランダムなグループコードを生成
                const randomCode = "DP-" + Math.floor(1000 + Math.random() * 9000);
                currentUser = name;
                currentGroup = randomCode;
            } else {
                const name = document.getElementById('joinName').value.trim();
                const code = document.getElementById('joinCode').value.trim().toUpperCase();
                if(!name || !code) return alert('ユーザー名とグループコードを入力してください');
                
                currentUser = name;
                currentGroup = code;
            }

            // UIの切り替え（オーバーレイを非表示、チャットを表示）
            document.getElementById('authOverlay').style.opacity = "0";
            document.getElementById('authOverlay').style.visibility = "hidden";
            
            const chatContainer = document.getElementById('chatContainer');
            chatContainer.classList.add('visible');

            // ヘッダー情報の更新
            document.getElementById('displayGroupCode').innerText = `CODE: ${currentGroup}`;
            
            // システムメッセージ
            addMessage("SYSTEM", `${currentUser} が参加しました。`, "received");

            // ローカルストレージの監視を開始（簡易的な別タブ間リアルタイム通信）
            initStorageSync();
        }

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if(!text) return;

            const msgData = {
                group: currentGroup,
                user: currentUser,
                text: text,
                time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}),
                id: Math.random().toString(36).substr(2, 9)
            };

            // ローカルストレージに保存（これで別タブで開いている同じグループの人に送信される）
            localStorage.setItem('last_chat_msg', JSON.stringify(msgData));
            
            // 自分の画面に表示
            addMessage(currentUser, text, "sent", msgData.time);
            input.value = "";
        }

        function handleKeyPress(e) {
            if(e.key === 'Enter') sendMessage();
        }

        function addMessage(user, text, side, time = "") {
            const container = document.getElementById('chatMessages');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${side}`;
            
            if(side === 'received') {
                msgDiv.innerHTML = `<span class="meta">${user} ${time}</span>${escapeHTML(text)}`;
            } else {
                msgDiv.innerHTML = `<span class="meta">${time}</span>${escapeHTML(text)}`;
            }

            container.appendChild(msgDiv);
            container.scrollTop = container.scrollHeight;
        }

        // 別タブ（同一ブラウザ内）での擬似オンライン同期
        function initStorageSync() {
            window.addEventListener('storage', (e) => {
                if (e.key === 'last_chat_msg' && e.newValue) {
                    const data = JSON.parse(e.newValue);
                    // 同じグループコード、かつ自分以外の発言であれば表示
                    if (data.group === currentGroup && data.user !== currentUser) {
                        addMessage(data.user, data.text, "received", data.time);
                    }
                }
            });
        }

        function leaveGroup() {
            // リロードして初期状態に戻す
            location.reload();
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }
    </script>
</body>
</html>
